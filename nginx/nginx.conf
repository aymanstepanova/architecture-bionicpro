worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Cache for static report files served from Minio via reverse proxy
  proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=reports_cache:50m
    max_size=1g
    inactive=7d
    use_temp_path=off;

  server {
    listen 80;

    # Map: /reports-cache/<objectKey> -> http://minio:9000/reports/<objectKey>
    location /reports-cache/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_cache reports_cache;
      proxy_cache_key $scheme$proxy_host$request_uri;
      proxy_cache_valid 200 206 30d;
      proxy_cache_valid 404 1m;

      # We want caching even if upstream doesn't send cache headers
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_hide_header Set-Cookie;

      add_header X-Cache-Status $upstream_cache_status always;

      # Provide cache-friendly headers for clients
      expires 30d;

      proxy_pass http://minio:9000/reports/;
    }
  }
}

